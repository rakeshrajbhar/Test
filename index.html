<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saaragya Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      background-color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 16px;
      font-weight: 600;
      font-size: 18px;
      background-color: #4f46e5;
      color: white;
      text-align: center;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .chat-input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #eee;
      background-color: #fafafa;
    }
    .chat-input input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 12px;
      border-radius: 20px;
      background-color: #f0f0f0;
    }
    .chat-input button {
      margin-left: 8px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .msg {
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 16px;
      max-width: 75%;
      line-height: 1.4;
      font-size: 14px;
    }
    .outgoing {
      background-color: #e0e7ff;
      align-self: flex-end;
    }
    .incoming {
      background-color: #f1f5f9;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">Saaragya Support</div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-input" id="chatForm">
      <input type="text" id="messageInput" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // 🔐 Replace with your own Firebase config
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional


    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const chatId = "default-room"; // for now a single global room
    const chatRef = db.collection("chats").doc(chatId).collection("messages");

    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const chatMessages = document.getElementById('chatMessages');

    function appendMessage(text, type = 'outgoing') {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;
      appendMessage(message, 'outgoing');
      messageInput.value = '';

      await chatRef.add({
        text: message,
        type: 'outgoing',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    chatRef.orderBy('timestamp')
      .onSnapshot(snapshot => {
        chatMessages.innerHTML = '';
        snapshot.forEach(doc => {
          const msg = doc.data();
          appendMessage(msg.text, msg.type);
        });
      });
  </script>
</body>
</html>
